[pytest]
# Pytest configuration for fstack tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    optional: mark test as optional (will be skipped if they flake frequently)
    unit: mark test as a unit test
    integration: mark test as an integration test
    slow: mark test as slow-running
    async: mark test as async-based

# Test output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Run these by default (excluding optional, slow)
# Override with: pytest -m optional (to run only optional)
# Or: pytest -m "not optional" (to skip optional)
